<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Background Container -->
  <rect width="512" height="512" rx="128" fill="#09090b" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg-gradient)" opacity="0.15" />
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="url(#bg-gradient)" stroke-width="8" fill="none" opacity="0.4" />

  <!-- Chatbot Brain / Sparkle Icon Center -->
  <g transform="translate(106, 106) scale(0.585)">
    <!-- Central Main Star / Sparkle -->
    <path d="M256 32 C256 155 357 256 480 256 C357 256 256 357 256 480 C256 357 155 256 32 256 C155 256 256 155 256 32 Z" 
          fill="url(#bg-gradient)" filter="url(#glow)" />
    <!-- Secondary Sparkle -->
    <path d="M416 96 C416 137 450 171 491 171 C450 171 416 205 416 246 C416 205 382 171 341 171 C382 171 416 137 416 96 Z" 
          fill="#38bdf8" />
  </g>
</svg>
