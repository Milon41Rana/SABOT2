<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary PWA & SEO Tags -->
    <title>Gemini Flash Lite Chatbot</title>
    <meta name="description" content="Ultra-fast intelligent AI Chatbot powered by Gemini 3.1 Flash Lite. Progressive Web App with offline support." />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Theme & Status Bar Colors -->
    <meta name="theme-color" content="#4f46e5" />
    <meta name="background-color" content="#09090b" />
    <meta name="color-scheme" content="dark" />
    
    <!-- iOS / Safari Mobile Web App Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.svg" />
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="Gemini Flash Lite Chatbot" />
    <meta property="og:description" content="Intelligent AI Chatbot PWA powered by Gemini 3.1 Flash Lite." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.svg" />
  </head>
  <body class="bg-zinc-950 text-zinc-100 overflow-hidden select-none">
